# jobscout scanner configuration.
# Secrets (credentials, tokens) are NOT here -- they come from environment
# variables sourced from k8s Secrets, see k8s/secrets.md.

scanner:
  # How many matched postings' assess -> notify -> compose pipeline run
  # concurrently. Sequential processing was taking 15-20+ min/run once a
  # couple dozen postings matched -- each /assess call is a `claude -p`
  # completion (30-50s typical, several minutes when application-writer's
  # retry/timeout logic kicks in on a slow one) -- and these are otherwise
  # independent postings, safe to overlap. The git commit/push to
  # jobscout-applications in store.mark_seen() stays serialized (main.py
  # locks around it) regardless of this value.
  assess_concurrency: 4

criteria:
  keywords:
    - python
    - devops
    - platform
    - oscp
    - nixos
    - nix
    - kubernetes
    - openshift
    - linux
    - ai security
    - llm security
    - prompt injection
    - red team
    - adversarial ml
    - mlsecops
    - ai governance
    - genai security
    # 2026-09-02: pure AI-engineering/LLM-integration terms, added after a
    # real miss -- a "Senior AI Engineer" posting (LLM/Agent/MCP
    # integration, agentic AI platform) never matched because the keyword
    # list only had security-flavored AI terms, not generic AI-engineering
    # ones. These are intentionally broad/noisy at the keyword-prefilter
    # stage -- candidate-profile.md's Erweiterung 2 is the actual fit gate
    # downstream (LLM /assess), this list just decides what's worth an
    # /assess call at all.
    - llm
    - agentic ai
    - ai agent
    - mcp
    - model context protocol
    - generative ai
    - genai
  min_matches: 1
  target_rate_eur_per_hour: 100
  # LLM-assessed fit_level (from application-writer's /assess) required to
  # trigger a notification + full /compose draft. Below this, a posting is
  # logged and skipped -- signal over volume, see candidate-profile.md for
  # what drives the assessment itself (contract type, remote-only, AI-
  # Security direction).
  min_fit_level: solide
  # Optional second gate on the blind match score from /assess (percent,
  # scored against the master CV -- see application_writer/rules/match-eval.md).
  # Unset = notify on fit_level alone; the score still rides along in the
  # ntfy push for prioritization. Fail-open when scoring itself failed.
  # min_match_score: 60
  # Enforced hard in candidate-profile.md for permanent/Festanstellung
  # postings (contracting stays as before). Also used where a portal search
  # itself supports a remote filter (see driver configs below).
  remote_only: true
  # Enabled 2026-09-01 after the full E2E test run (freelancermap-3041826):
  # a passing fit_level now triggers /compose -- tailored CV + Anschreiben +
  # blind match eval, committed to jobscout-applications, Obsidian note via
  # obsidian-writer, ntfy push. Drafts land as composed/needs-review and are
  # never auto-submitted. (Round-1 notify-only mode ran 2026-08-13 to
  # 2026-09-01.)
  compose_enabled: true

# All portals log in (driver: playwright, uniformly) -- decided 2026-08-14.
# Anonymous access was only ever verified to return *a* result set, never
# confirmed to be the *complete* one a logged-in account sees (freelancermap
# turned out to be outright pagination-gated without login), so this is now
# the default for every portal rather than an exception for a few.
portals:
  freelancermap:
    enabled: true
    driver: playwright
    # 2026-08-18: added the ai-security terms from criteria.keywords -- the
    # query previously only had the broad platform/devops terms, so with
    # the AI-Security hard-gate in candidate-profile.md, everything this
    # portal ever fetched was structurally incapable of passing (matched
    # on "platform"/"devops" but never even contained an AI-Security term
    # to begin with). Same root cause as xing/linkedin's query, just never
    # applied here since freelancermap's query was already "working" in
    # the sense of returning results -- just not the right ones anymore.
    search_url: "https://www.freelancermap.de/projekte?created=1&projectContractTypes%5B0%5D=contracting&remoteInPercent%5B0%5D=100&hideAppliedProjects=true&query=%28python+OR+devops+OR+platform+OR+oscp+OR+nixos+OR+nix+OR+kubernetes+OR+openshift+OR+linux+OR+%22ai+security%22+OR+%22llm+security%22+OR+%22prompt+injection%22+OR+%22red+team%22+OR+%22adversarial+ml%22+OR+mlsecops+OR+%22ai+governance%22+OR+%22genai+security%22%29&countries%5B%5D=1&sort=1"
    max_pages: 3

  randstad:
    enabled: true
    driver: playwright
    # /jobs/q-<keyword>/ facet paths -- only supports ONE search term, no OR
    # syntax at all (unlike the other portals). Switched from "python" to
    # "ai-security" 2026-08-18: since candidate-profile.md's hard-gate now
    # requires AI-Security relevance for every match regardless of tech
    # stack, a single-term search should spend its one shot on the
    # mandatory criterion, not an optional one. Unverified live -- if this
    # returns 0 results, randstad's slug format may need a different
    # encoding (try "ai+security" or "ai%20security").
    search_url: "https://www.randstad.de/jobs/q-ai-security/q-homeoffice/"

  hays:
    enabled: true
    # httpx, not playwright -- reverted 2026-08-18, see hays.py's docstring:
    # hays.de has no self-service login (its /login is SAML SSO, confirmed
    # live), so there was never anything requiring a real browser here.
    search_url: "https://www.hays.de/jobsuche/stellenangebote-jobs"

  solcom:
    enabled: true
    driver: playwright
    search_url: "https://www.solcom.de/de/projektportal/projektangebote"

  xing:
    enabled: true
    driver: playwright
    # Phrases quoted (%22...%22) around each OR-term -- found 2026-08-16:
    # the unquoted version (`platform engineering OR ai security`) returned
    # 0 results despite jobs matching this existing daily on the site.
    # Confirmed correct 2026-08-18 in a live authenticated session:
    # "999+ jobs found" for this exact query. The 0-results problem was
    # never the query -- it was that xing.py's login always failed first
    # (guessed a /login URL that's a 404; real login is a separate
    # login.xing.com subdomain), so no run ever got as far as the search
    # itself. See xing.py's docstring for the persisted-session fix.
    search_url: "https://www.xing.com/jobs/search?keywords=%22platform%20engineering%22%20OR%20%22ai%20security%22&remote=true"

  linkedin:
    enabled: true
    driver: playwright
    # f_WT=2 is LinkedIn's own "Remote" work-type filter value. Phrases
    # quoted for the same reason as xing's search_url above.
    search_url: "https://www.linkedin.com/jobs/search/?keywords=%22platform%20engineering%22%20OR%20%22ai%20security%22&f_WT=2"

  freelance:
    enabled: true
    driver: playwright
    search_url: "https://www.freelance.de/projekte.html?q=python+OR+devops+OR+platform+OR+kubernetes+OR+security"

notifications:
  ntfy:
    base_url: "https://ntfy.charemma.de"
    topic: "jobscout"

applications_repo:
  clone_url: "https://github.com/charemma/jobscout-applications.git"
  local_path: "/tmp/jobscout-applications"

application_writer:
  base_url: "http://jobscout-application-writer.jobscout.svc.cluster.local"

# Which LLM backend/model each application-writer pipeline stage uses.
# pipeline.py has no knowledge of concrete CLI commands or providers -- it
# only ever asks the router for "the backend configured for stage X" (see
# application_writer/llm/). ClaudeCliBackend is the default everywhere:
# a deliberate choice for a personal, low-volume system billed against a
# CLI subscription rather than a metered API (see
# application_writer/llm/claude_cli_backend.py). Swapping a stage to
# codex, or to a future API-based backend, is a config change here, not a
# code change. See ROADMAP.md #2/#3.
llm:
  backends:
    claude:
      type: claude-cli
      model: sonnet
      timeout_seconds: 180

    codex:
      type: codex-cli
      model: auto
      timeout_seconds: 180

  stages:
    analysis: claude
    writing: claude
    review: claude
    scoring: claude
