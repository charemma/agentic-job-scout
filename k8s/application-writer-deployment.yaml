apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobscout-application-writer
  labels:
    app: jobscout-application-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobscout-application-writer
  template:
    metadata:
      labels:
        app: jobscout-application-writer
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: application-writer
          image: ghcr.io/charemma/jobscout-application-writer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: jobscout-application-writer-secrets
          # anthropic_client.py shells out to `claude -p`, authenticated via
          # this mounted OAuth session -- NOT an ANTHROPIC_API_KEY (that env
          # var must stay unset here, its presence would override the
          # subscription-billed OAuth path). See k8s/secrets.md and
          # anthropic_client.py's docstring for the full rationale.
          volumeMounts:
            - name: claude-credentials
              mountPath: /home/appwriter/.claude/.credentials.json
              subPath: credentials.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: claude-credentials
          secret:
            secretName: jobscout-claude-credentials
