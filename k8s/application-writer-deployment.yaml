apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobscout-application-writer
  labels:
    app: jobscout-application-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobscout-application-writer
  template:
    metadata:
      labels:
        app: jobscout-application-writer
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: application-writer
          image: ghcr.io/charemma/jobscout-application-writer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: jobscout-application-writer-secrets
          # claude_cli.py shells out to `claude -p`, authenticated via
          # CLAUDE_CODE_OAUTH_TOKEN below -- NOT an ANTHROPIC_API_KEY (that
          # env var must stay unset here, its presence would override the
          # subscription-billed OAuth path). This token comes from
          # `claude setup-token`, run once inside a throwaway pod using this
          # same image (so it's a fully independent session, not a copy of
          # anyone's local `claude login` session -- avoids the refresh-token
          # collision that a shared/copied credentials.json had). Valid 1
          # year. See k8s/secrets.md and claude_cli.py's docstring for
          # the full rationale.
          env:
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jobscout-claude-token
                  key: token
          # timeoutSeconds explicit -- the 1s k8s default is too tight here.
          # /assess runs `claude -p` synchronously in a threadpool worker;
          # under real load (or general node resource pressure) the event
          # loop can be slow enough to blow past 1s on /healthz even though
          # the endpoint itself does no work, which was killing the pod
          # mid-request and turning into intermittent 500s for the caller.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
