# Only jobscout workload pinned to a specific node: the Obsidian vault is
# only present on home-node (Syncthing-synced, see infra-config/modules/core.nix).
# The `vault-access: "true"` node label is set declaratively on home-node's k3s
# agent config in infra-config (services/k3s/agent.nix), not via `kubectl label`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobscout-obsidian-writer
  labels:
    app: jobscout-obsidian-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobscout-obsidian-writer
  template:
    metadata:
      labels:
        app: jobscout-obsidian-writer
    spec:
      nodeSelector:
        vault-access: "true"
      # home-node carries dedicated=home:NoSchedule (see infra-config
      # hosts/home-node) -- same toleration as the scanner CronJob.
      tolerations:
        - key: dedicated
          operator: Equal
          value: home
          effect: NoSchedule
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: obsidian-writer
          image: ghcr.io/charemma/agentic-job-scout-obsidian-writer:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: jobscout-obsidian-writer-secrets
          env:
            - name: VAULT_PATH
              value: /vault
          volumeMounts:
            - name: vault
              mountPath: /vault
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: vault
          hostPath:
            path: /home/user/Documents/Notes
            type: Directory
