# Pinned to a home-network node rather than the VPS: the xing/linkedin/
# solcom fetchers use Playwright-driven logins, and running from a
# consistent, non-datacenter network is an account-hygiene practice for
# those (see scanner/fetchers/linkedin.py's docstring for the full
# rationale). The `home-network: "true"` label is set declaratively on
# that node's k3s agent config in the infra-config repo (services/k3s/
# agent.nix), same pattern as obsidian-writer's `vault-access` label --
# not `kubectl label`, so it survives a node rebuild.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jobscout-scanner
spec:
  # 6x/day, 8-19 Uhr only -- the candidate doesn't need results overnight, and this
  # stays comfortably under an hourly cadence for the login-based portals.
  # timeZone is explicit because CronJob
  # schedules default to UTC regardless of the node's own tz (Europe/Athens
  # per infra-config) -- without this the window would run 2-3h too early.
  schedule: "0 8-19/2 * * *"
  timeZone: "Europe/Athens"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0 # a failed run is retried next tick by the schedule itself, not immediately
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            home-network: "true"
          tolerations:
            - key: dedicated
              operator: Equal
              value: home
              effect: NoSchedule
          imagePullSecrets:
            - name: ghcr-pull-secret
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scanner
              image: ghcr.io/charemma/agentic-job-scout-scanner:latest
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: 1000m
                  memory: 1Gi
              envFrom:
                - secretRef:
                    name: jobscout-scanner-secrets
              # Each portal's session file is mounted individually via
              # subPath into the same JOBSCOUT_SESSION_DIR
              # (/etc/jobscout-sessions) rather than mounting each secret's
              # whole directory -- two directory-level mounts can't share
              # one path, and Secrets.session_state_path_for() expects
              # every portal's <portal>.json to live side by side in one
              # directory.
              volumeMounts:
                - name: linkedin-session
                  mountPath: /etc/jobscout-sessions/linkedin.json
                  subPath: linkedin.json
                  readOnly: true
                - name: xing-session
                  mountPath: /etc/jobscout-sessions/xing.json
                  subPath: xing.json
                  readOnly: true
          # optional: true so the CronJob still runs before a given
          # session is ever bootstrapped (see scripts/*_login_bootstrap.py)
          # -- that portal's file is just absent then, and
          # Secrets.session_state_path_for() falls back to a fresh login,
          # same as before session persistence existed.
          volumes:
            - name: linkedin-session
              secret:
                secretName: jobscout-linkedin-session
                optional: true
            - name: xing-session
              secret:
                secretName: jobscout-xing-session
                optional: true
