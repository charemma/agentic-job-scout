apiVersion: batch/v1
kind: CronJob
metadata:
  name: jobscout-scanner
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0 # a failed run is retried next hour by the schedule itself, not immediately
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: scanner
              image: ghcr.io/charemma/jobscout-scanner:latest
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: jobscout-scanner-secrets
