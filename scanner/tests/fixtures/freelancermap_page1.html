 rgb(0, 0, 0);\">Projekt</strong></div><div><br></div><div><span style=\"color: rgb(0, 0, 0);\">Von Grund auf soll eine moderne ERP-Plattform mit folgenden Bereichen entwickelt werden:</span></div><ul><li><span class=\"ql-ui\" contenteditable=\"false\"></span><span style=\"color: rgb(0, 0, 0);\">CRM, Kontakte, Leads und Vertriebsaktivitäten</span></li><li><span class=\"ql-ui\" contenteditable=\"false\"></span><span style=\"color: rgb(0, 0, 0);\">Projektmanagement und Personalwesen</span></li><li><span class=\"ql-ui\" contenteditable=\"false\"></span><span style=\"color: rgb(0, 0, 0);\">Backoffice, Rechnungs- und Vertragsverarbeitung</span></li><li><span class=\"ql-ui\" contenteditable=\"false\"></span><span style=\"color: rgb(0, 0, 0);\">konfigurierbare Rechnungs-, Prüfungs- und Freigabeworkflows</span></li><li><span class=\"ql-ui\" contenteditable=\"false\"></span><span style=\"color: rgb(0, 0, 0);\">Dokumentenmanagement, OCR und KI-gestützte Datenextraktion</span></li><li><span class=\"ql-ui\" contenteditable=\"false\"></span><span style=\"color: rgb(0, 0, 0);\">Reporting per natürlicher Sprache mit Tabellen, KPIs und Diagrammen</span></li><li><span class=\"ql-ui\" contenteditable=\"false\"></span><span style=\"color: rgb(0, 0, 0);\">Benutzer-, Rollen-, Team- und Aufgabenmanagement</span></li><li><span class=\"ql-ui\" contenteditable=\"false\"></span><span style=\"color: rgb(0, 0, 0);\">Echtzeitbenachrichtigungen mit SignalR</span></li><li><span class=\"ql-ui\" contenteditable=\"false\"></span><span style=\"color: rgb(0, 0, 0);\">Microsoft Graph, Outlook und Microsoft-365-Integration</span></li><li><span class=\"ql-ui\" contenteditable=\"false\"></span><span style=\"color: rgb(0, 0, 0);\">Voice AI mit Speech-to-Text und Text-to-Speech</span></li><li><span class=\"ql-ui\" contenteditable=\"false\"></span><span style=\"color: rgb(0, 0, 0);\">Cloud-Bereitstellung auf Microsoft Azure</span></li></ul><div><span style=\"color: rgb(0, 0, 0);\">Das MVP soll innerhalb von </span><strong style=\"color: rgb(0, 0, 0);\">1–3 Monaten</strong><span style=\"color: rgb(0, 0, 0);\"> entwickelt und anschließend produktiv eingeführt werden.</span></div><div><br></div><div><strong style=\"color: rgb(0, 0, 0);\">Aufgaben</strong></div><ul><li><span class=\"ql-ui\" contenteditable=\"false\"></span><span style=\"color: rgb(0, 0, 0);\">Konzeption der gesamten Solution- und Cloud-Architektur</span></li><li><span class=\"ql-ui\" contenteditable=\"false\"></span><span style=\"color: rgb(0, 0, 0);\">Entwicklung von Frontend, Backend und KI-Services</span></li><li><span class=\"ql-ui\" contenteditable=\"false\"></span><span style=\"color: rgb(0, 0, 0);\">Aufbau modularer, skalierbarer und sicherer Strukturen</span></li><li><span class=\"ql-ui\" contenteditable=\"false\"></span><span style=\"color: rgb(0, 0, 0);\">Entwicklung komplexer Enterprise-UIs, Dashboards, Tabellen und Workflow-Builder</span></li><li><span class=\"ql-ui\" contenteditable=\"false\"></span><span style=\"color: rgb(0, 0, 0);\">Entwicklung sicherer REST-APIs und Background Worker</span></li><li><span class=\"ql-ui\" contenteditable=\"false\"></span><span style=\"color: rgb(0, 0, 0);\">PostgreSQL-Datenmodellierung, Migrationen und Performanceoptimierung</span></li><li><span class=\"ql-ui\" contenteditable=\"false\"></span><span style=\"color: rgb(0, 0, 0);\">Integration von OCR-, LLM-, RAG-, MCP- und Vector-Search-Komponenten</span></li><li><span class=\"ql-ui\" contenteditable=\"false\"></span><span style=\"color: rgb(0, 0, 0);\">Entwicklung kontrollierter KI-Pipelines mit strukturierten JSON-Ausgaben</span></li><li><span class=\"ql-ui\" contenteditable=\"false\"></span><span style=\"color: rgb(0, 0, 0);\">Integration von Azure Service Bus, Blob Storage, Graph API und SignalR</span></li><li><span class=\"ql-ui\" contenteditable=\"false\"></span><span style=\"color: rgb(0, 0, 0);\">Dockerisierung, Deployment, CI/CD, Logging und Monitoring</span></li><li><span class=\"ql-ui\" contenteditable=\"false\"></span><span style=\"color: rgb(0, 0, 0);\">vollständiger Review von KI-generiertem Code</span></li><li><span class=\"ql-ui\" contenteditable=\"false\"></span><span style=\"color: rgb(0, 0, 0);\">Unit-, Integrations-, API- und Frontend-Tests</span></li><li><span class=\"ql-ui\" contenteditable=\"false\"></span><span style=\"color: rgb(0, 0, 0);\">technische Dokumentation und Go-live-Begleitung</span></li></ul><div><strong style=\"color: rgb(0, 0, 0);\">Technischer Stack</strong></div><div><br></div><div><strong style=\"color: rgb(0, 0, 0);\">Frontend:</strong><span style=\"color: rgb(0, 0, 0);\"> React, TypeScript, JavaScript, Vite, Material UI, React Router, State Management, Charting, Drag-and-drop, WebSockets, SignalR</span></div><div><br></div><div><strong style=\"color: rgb(0, 0, 0);\">Backend:</strong><span style=\"color: rgb(0, 0, 0);\"> C#, .NET / </span><u style=\"color: rgb(0, 0, 0);\">ASP.NET</u><span style=\"color: rgb(0, 0, 0);\"> Core, Entity Framework Core, Python, FastAPI, REST APIs, Background Services, asynchrone Verarbeitung</span></div><div><br></div><div><strong style=\"color: rgb(0, 0, 0);\">KI / AI:</strong><span style=\"color: rgb(0, 0, 0);\"> Qwen, Llama, Mistral, DeepSeek, GPT, vLLM, LangChain, LangGraph, MCP, RAG, Embeddings, Sentence Transformers, Hugging Face, Prompt Engineering, Tool/Function Calling</span></div><div><br></div><div><strong style=\"color: rgb(0, 0, 0);\">Document & Voice AI:</strong><span style=\"color: rgb(0, 0, 0);\"> OCR, Document AI, Whisper, Faster-Whisper, Piper TTS, PDF-Verarbeitung und strukturierte Information Extraction</span></div><div><br></div><div><strong style=\"color: rgb(0, 0, 0);\">Datenbanken:</strong><span style=\"color: rgb(0, 0, 0);\"> PostgreSQL, SQL, pgvector, JSONB, ORM, Migrationen, Views und sichere Query Builder</span></div><div><br></div><div><strong style=\"color: rgb(0, 0, 0);\">Cloud & DevOps:</strong><span style=\"color: rgb(0, 0, 0);\"> Microsoft Azure, Azure Container App
